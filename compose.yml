services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /home/chyld/data/jellyfin/config:/config
      - /home/chyld/data/jellyfin/cache:/cache
      - type: bind
        source: /home/chyld/data/copyparty/files/movies
        target: /media0
        read_only: true
      - type: bind
        source: /mnt/truenas/Media/External/Movies
        target: /media1
        read_only: true
    restart: 'unless-stopped'

